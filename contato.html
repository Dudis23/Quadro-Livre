<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <!-- viewport: obrigatório para o Bootstrap ser responsivo (mobile first) -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contato - Quadro Livre</title>

    <!-- Bootstrap 5 (CSS) via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS próprio: carregado DEPOIS do Bootstrap, só com pequenos ajustes -->
    <link href="css/estilo.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <!-- NAVBAR + DROPDOWN: logo à esquerda; à direita o botão de 3 barrinhas que abre o menu suspenso com todas as páginas -->
    <nav class="navbar navbar-dark bg-primary sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Quadro Livre</a>

            <div class="d-flex align-items-center gap-2">
                <a class="btn btn-light btn-sm" href="postar.html">Postar ideia</a>

                <!-- dropdown: o botão (data-bs-toggle="dropdown") abre/fecha o dropdown-menu logo abaixo -->
                <div class="dropdown">
                    <button class="btn border-0 p-1" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                        aria-label="Abrir menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" href="index.html">Início</a></li>
                        <li><a class="dropdown-item" href="sobre.html">Sobre</a></li>
                        <li><a class="dropdown-item active" href="contato.html" aria-current="page">Contato</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="postar.html">Postar uma ideia</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        <div class="container py-5">
            <div class="row g-4">
                <section class="col-lg-8">
                    <h1 class="h3 text-uppercase mb-3">Fale conosco</h1>

                    <div class="alert alert-info" role="alert">
                        Respondemos em até 2 dias úteis. Os campos com <strong>*</strong> são obrigatórios.
                    </div>

                    <!-- FORMULÁRIO: form-label + form-control; row g-3 + col-md-6 organizam em colunas -->
                    <form class="card card-body shadow-sm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nome" class="form-label">Nome *</label>
                                <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">E-mail *</label>
                                <div class="input-group">
                                    <span class="input-group-text">@</span>
                                    <input type="email" class="form-control" id="email" placeholder="voce@email.com" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <label for="assunto" class="form-label">Assunto</label>
                                <select class="form-select" id="assunto">
                                    <option selected>Dúvida</option>
                                    <option>Sugestão</option>
                                    <option>Denúncia</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <textarea class="form-control area-ideia" id="mensagem" placeholder="Mensagem" required></textarea>
                                    <label for="mensagem">Escreva sua mensagem *</label>
                                </div>
                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2">
                                <button type="reset" class="btn btn-outline-secondary">Limpar</button>
                                <button type="submit" class="btn btn-primary">Enviar</button>
                            </div>
                        </div>
                    </form>
                </section>

                <!-- ASIDE: card de perfil. d-flex flex-column align-items-center centraliza tudo em coluna -->
                <aside class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body d-flex flex-column align-items-center text-center">
                            <img src="img/ft.jpg" class="rounded-circle foto-perfil mb-3" alt="Foto de perfil">
                            <h2 class="h5 text-uppercase">Eu</h2>
                            <div class="d-flex gap-4 text-muted">
                                <span>Amigos: <strong>0</strong></span>
                                <span>Seguidores: <strong>0</strong></span>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 text-center text-md-start">
            <div>
                <p class="mb-0">Rua Boa Ideia, 234 - Capacity</p>
                <p class="mb-0">(45) 99239-9239 · contato@quadrolivre.com</p>
            </div>
            <small>© 2026 Quadro Livre</small>
        </div>
    </footer>
