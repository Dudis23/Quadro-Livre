<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <!-- viewport: obrigatório para o Bootstrap ser responsivo (mobile first) -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Postar - Quadro Livre</title>

    <!-- Bootstrap 5 (CSS) via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS próprio: carregado DEPOIS do Bootstrap, só com pequenos ajustes -->
    <link href="css/estilo.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <!-- NAVBAR + DROPDOWN: logo à esquerda; à direita o botão de 3 barrinhas que abre o menu suspenso com todas as páginas -->
    <nav class="navbar navbar-dark bg-primary sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Quadro Livre</a>

            <div class="d-flex align-items-center gap-2">
                <a class="btn btn-light btn-sm" href="postar.html">Postar ideia</a>

                <!-- dropdown: o botão (data-bs-toggle="dropdown") abre/fecha o dropdown-menu logo abaixo -->
                <div class="dropdown">
                    <button class="btn border-0 p-1" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                        aria-label="Abrir menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" href="index.html">Início</a></li>
                        <li><a class="dropdown-item" href="sobre.html">Sobre</a></li>
                        <li><a class="dropdown-item" href="contato.html">Contato</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item active" href="postar.html" aria-current="page">Postar uma ideia</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        <div class="container py-5">
            <div class="row justify-content-center">
                <section class="col-lg-8">
                    <div class="card shadow">
                        <div class="card-header text-bg-primary">
                            <h1 class="h4 mb-0">Criar postagem</h1>
                        </div>
                        <div class="card-body">
                            <form action="index.html" method="get">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="usuario" class="form-label">Usuário *</label>
                                        <input type="text" class="form-control" id="usuario" name="usuario"
                                            placeholder="Digite seu nome de usuário" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="titulo" class="form-label">Título (opcional)</label>
                                        <input type="text" class="form-control" id="titulo" name="titulo"
                                            placeholder="Título da postagem">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="categoria" class="form-label">Categoria</label>
                                        <select class="form-select" id="categoria" name="categoria">
                                            <option>Ideia</option>
                                            <option>Projeto</option>
                                            <option>Evento</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 d-flex flex-column justify-content-end">
                                        <span class="form-label">Visibilidade</span>
                                        <div class="d-flex gap-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="vis" id="visPub" checked>
                                                <label class="form-check-label" for="visPub">Pública</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="vis" id="visAmi">
                                                <label class="form-check-label" for="visAmi">Amigos</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <textarea class="form-control area-ideia" id="conteudo" name="conteudo"
                                                placeholder="Conteúdo" required></textarea>
                                            <label for="conteudo">Escreva sua postagem *</label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" role="switch" id="notificar" checked>
                                            <label class="form-check-label" for="notificar">Receber avisos de curtidas</label>
                                        </div>
                                    </div>
                                    <div class="col-12 d-flex justify-content-end gap-2">
                                        <a href="index.html" class="btn btn-outline-secondary">Cancelar</a>
                                        <button type="submit" class="btn btn-success">Publicar</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 text-center text-md-start">
            <div>
                <p class="mb-0">Rua Boa Ideia, 234 - Capacity</p>
                <p class="mb-0">(45) 99239-9239 · contato@quadrolivre.com</p>
            </div>
            <small>© 2026 Quadro Livre</small>
        </div>
    </footer>

    <!-- Bootstrap JS (bundle inclui o Popper): faz funcionar o carousel, o dropdown, o menu hambúrguer e o X do alerta.
         Não há nenhum JavaScript escrito por mim. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
